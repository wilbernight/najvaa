# Limits for the two endpoints that make this box fetch from the internet on a
# client's behalf: Instagram link previews and GIF search. One client must not
# be able to use up everyone else's share of those fetches.
#
# $binary_remote_addr is the real visitor IP: Cloudflare's real-IP module is
# configured in najva-cloudflare.conf. The counters live in memory only, are
# never logged, and hold no content.
limit_req_zone $binary_remote_addr zone=najva_fetch:10m rate=30r/m;

# The relay answers 429 for its own budgets; keep the same answer here.
limit_req_status 429;
